# ViT-LENS Central Configuration
# Project: Discovering and Causally Testing Interpretable Features in Vision Transformers Using TopK Sparse Autoencoders

experiment:
  name: "vit_lens_experiment"
  seed: 42
  device: "auto" # "auto", "cuda", or "cpu"

dataset:
  name: "imagenet100_prototype"
  data_dir: "./data"
  image_size: 224
  batch_size: 32
  num_workers: 2
  val_split: 0.2
  max_samples: 1000 # Prototype limit; set to null for full dataset
  class_mapping_path: "./data/imagenet100_to_1k_mapping.json"

vit:
  model_name: "vit_base_patch16_224.augreg_in1k" # Standard timm ViT-B/16 augreg
  pretrained: true
  num_classes: 1000
  target_layer_idx: 7 # Intermediate transformer block 7 (0-indexed out of 12 blocks)
  d_model: 768
  patch_size: 16
  num_patches: 196
  include_cls_token: false # CLS excluded from patch-level SAE training by default

sae:
  d_in: 768
  d_sae: 3072 # 4x expansion factor
  top_k: 32 # Retain exactly top 32 active features per patch vector
  lr: 0.0003
  weight_decay: 0.0
  batch_size: 256 # Batch size of individual patch activation vectors
  num_epochs: 10
  save_every_epochs: 1
  dead_feature_threshold_steps: 500 # Mark feature dead if unactivated for N steps
  resample_dead_features: false
  checkpoint_path: "/content/drive/MyDrive/ViT-LENS/checkpoints/final_sae_best.pt"
  checkpoint_dir: "./checkpoints"

extraction:
  output_dir: "./data/activations"
  chunk_size: 100 # Number of images per activation chunk file
  dtype: "float32"

feature_discovery:
  num_features_to_analyze: 30
  top_patches_per_feature: 16
  context_crop_padding: 16 # Extra pixel context around 16x16 patch
  candidate_labels_file: "./outputs/features/candidate_labels.json"
  output_dir: "./outputs/features"

intervention:
  default_feature_id: 127
  strengths: [0.0, 0.5, 1.0, 1.5, 2.0] # 0.0 = suppression, 1.0 = identity, 2.0 = amplification
  num_control_features: 8
  mode: "all_patches" # "all_patches" or "top_patches"
  output_dir: "./outputs/interventions"

demo:
  host: "0.0.0.0"
  port: 7860
  share: true
  precomputed_dir: "./outputs/precomputed"

